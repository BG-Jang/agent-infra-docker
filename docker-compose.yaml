version: "3.9"

services:
  # ── GPU Inference Container (vLLM + Unsloth NVFP4) ────────────────────
  # DGX Spark: 128GB unified memory → 컨테이너가 110GB 사용 가능
  # Hermes는 호스트(OS)에서 실행 → 18GB 여유
  # 공식 실행 명령: vllm serve unsloth/Qwen3.6-27B-NVFP4 \
  #               --moe-backend flashinfer_b12x \
  #               --speculative-config '{"method": "mtp", "num_speculative_tokens": 2}'
  inference:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dgx-inference
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      # DGX Spark 필수: cute-DSL sm_121a (이것 없으면 2배 느림!)
      - CUTE_DSL_ARCH=sm_121a
      # FlashInfer 어텐션 커널이 sm_121a에서 최초 forward 시 segfault를 일으켜
      # Triton 어텐션 백엔드로 대체(로그가 제시한 대체재). 원인 격리/우회용.
      - VLLM_ATTENTION_BACKEND=TRITON_ATTN
    volumes:
      # HuggingFace 모델 캐시 (마운트해서 다운로드 1회만)
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "/workspace/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 10m  # 모델 다운로드/컴파일에 최대 10분
      retries: 3
    # 128GB unified memory: 컨테이너 110GB (Hermes용 18GB 여유)
    mem_limit: 110g
    memswap_limit: 110g
    # 공식 실행 명령과 완전히 일치
    # MTP(Multi-Token Prediction)는 --speculative-config 플래그로 활성화됨
    command:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - unsloth/Qwen3.6-27B-NVFP4
      - --moe-backend
      - flashinfer_b12x
      - --speculative-config
      - '{"method": "mtp", "num_speculative_tokens": 2}'
      # unified memory(총 ~122GiB)는 호스트/OS와 공유하므로 기본값 0.92는
      # 부팅 시 free 메모리를 초과해 실패함. 호스트(Hermes 18GB) 여유를 두고 0.85로.
      - --gpu-memory-utilization
      - "0.85"
      # 텍스트 전용 서빙(Hermes 에이전트 용도). 비전 인코더 프로파일링이
      # ARM64/sm_121a에서 segfault를 일으키므로 이미지/영상 입력을 비활성화해 우회.
      # (멀티모달이 필요하면 아래 두 값을 1 이상으로 올리고 vision 경로를 별도 검증)
      - --limit-mm-per-prompt
      - '{"image": 0, "video": 0}'
      # torch.compile(inductor) 그래프 컴파일이 ARM64/sm_121a에서 segfault를 일으켜
      # eager 모드로 우회(inductor 융합·CUDA graph 비활성). 성능의 핵심인
      # cute-DSL/flashinfer_b12x MoE 커널은 런타임 커스텀 커널이라 eager에서도 동작함.
      # (툴체인 성숙 후 이 플래그를 제거해 torch.compile 재활성 시도 가능)
      - --enforce-eager

volumes:
  hf-cache:
    driver: local