version: "3.9"

services:
  # ── GPU Inference Container (llama.cpp) ────────────────────────────────
  # DGX Spark: 128GB unified memory → 컨테이너가 100GB 사용 가능
  # Hermes는 호스트(OS)에서 실행 → 28GB 여유
  inference:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dgx-inference
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      # llama.cpp 파라미터 (128GB unified memory 활용)
      - NGPU_LAYERS=99  # 모든 레이어 GPU에 로드
      - CONTEXT_SIZE=131072  # 128K 컨텍스트
      - BATCH_SIZE=32768
      - MEM_FRAC=0.95  # 95% 메모리 사용
    volumes:
      - ./models:/workspace/models:ro
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "/workspace/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 3
    # 128GB unified memory: 컨테이너 110GB (Hermes용 18GB 여유)
    mem_limit: 110g
    memswap_limit: 110g

volumes:
  hf-cache:
    driver: local